<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f9f9f7">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d0d0d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="울음 기록">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>아기 울음 기록</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>아기 울음 기록</h1>

    <p class="warning" id="storage-warning" hidden>
      저장된 기록을 읽지 못했습니다. 원본은 브라우저에 따로 보관해 두었습니다.
    </p>

    <section class="card" aria-labelledby="entry-heading">
      <h2 id="entry-heading">기록하기</h2>
      <div class="when">
        <label>날짜 <input type="date" id="entry-date" required></label>
        <label>시간 <input type="time" id="entry-time" required></label>
        <button type="button" class="ghost-button" id="entry-now">지금 시각</button>
      </div>
      <div class="record-buttons">
        <button type="button" data-record="cry" data-type="cry"><span class="swatch"></span>울음</button>
        <button type="button" data-record="bigCry" data-type="bigCry"><span class="swatch"></span>크게 울음</button>
        <button type="button" data-record="feed" data-type="feed"><span class="swatch"></span>분유</button>
      </div>
    </section>

    <section class="card" aria-labelledby="analysis-heading">
      <h2 id="analysis-heading">24시간 분석</h2>
      <div class="filters">
        <div class="presets" role="group" aria-label="조회 기간 빠른 선택">
          <button type="button" data-preset="7">최근 7일</button>
          <button type="button" data-preset="30">최근 30일</button>
          <button type="button" data-preset="90">최근 90일</button>
          <button type="button" data-preset="all">전체</button>
        </div>
        <div class="range">
          <label>시작일 <input type="date" id="range-start"></label>
          <label>종료일 <input type="date" id="range-end"></label>
        </div>
      </div>
      <p class="range-summary" id="range-summary" aria-live="polite"></p>
      <div class="tiles" id="tiles"></div>
      <p class="empty" id="chart-empty" hidden>이 기간에는 기록이 없습니다.</p>
      <div id="chart-area" hidden>
        <div class="chart-wrap">
          <div id="chart"></div>
          <div class="tooltip" id="tooltip" hidden></div>
        </div>
        <details class="table-view">
          <summary>시간대별 표 보기</summary>
          <table>
            <thead>
              <tr><th scope="col">시간대</th><th scope="col">울음</th><th scope="col">크게 울음</th><th scope="col">분유</th></tr>
            </thead>
            <tbody id="hour-table-body"></tbody>
          </table>
        </details>
      </div>
    </section>

    <section class="card" aria-labelledby="list-heading">
      <h2 id="list-heading">조회 기간의 기록</h2>
      <p class="empty" id="list-empty" hidden>표시할 기록이 없습니다.</p>
      <div id="record-list"></div>
      <button type="button" class="ghost-button" id="list-more" hidden>더 보기</button>
    </section>
  </main>

  <div class="toast" id="toast" role="status" hidden>
    <span id="toast-message"></span>
    <button type="button" id="toast-undo" hidden>되돌리기</button>
  </div>

  <script src="js/analysis.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/chart.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
